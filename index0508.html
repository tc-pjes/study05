<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>豐洲國小 母親節 AI 拍貼機 - 完美去背版 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>

<style>
body{
    margin:0;
    font-family:"Microsoft JhengHei", sans-serif;
    text-align:center;
    background: radial-gradient(circle,#fffafa,#ffffff);
    overflow-x: hidden;
    touch-action: manipulation;
}

/* 左右貼圖庫 */
.panel {
    position: fixed;
    top: 10px;
    width: 100px;
    height: 85vh;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    padding: 10px;
    overflow-y: auto;
    z-index: 1000;
}
#panel-left { left: 5px; }
#panel-right { right: 5px; }

@media (max-width: 768px) {
    .panel { width: 60px; height: 70vh; }
    .panel img, .emoji-item { width: 45px !important; font-size: 30px !important; }
    #canvas { width: 95vw !important; }
}

.col-title {
    font-size: 14px;
    font-weight: bold;
    color: #d81b60;
    margin-bottom: 12px;
    border-bottom: 2px solid #f8bbd0;
    padding-bottom: 5px;
}

.panel img, .emoji-item {
    width: 70px;
    margin: 12px auto;
    cursor: pointer;
    transition: transform 0.2s;
    display: block;
}
.emoji-item { font-size: 40px; text-align: center; line-height: 70px; }
.panel img:hover, .emoji-item:hover { transform: scale(1.15); }

/* 材質庫 */
.bg-1 { background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%); background-size: 8px 8px; }
.bg-2 { background-image: linear-gradient(45deg, #b4d2ff 25%, transparent 25%, transparent 50%, #b4d2ff 50%, #b4d2ff 75%, transparent 75%, transparent); background-size: 8px 8px; }
.bg-3 { background-image: radial-gradient(#ff5050 20%, transparent 20%); background-size: 8px 8px; }
.bg-4 { background-image: radial-gradient(#e6e6e6 20%, transparent 10%); background-size: 8px 8px; }
.bg-5 { background-color: #333; background-image: linear-gradient(135deg, #000 25%, transparent 25%), linear-gradient(225deg, #000 25%, transparent 25%); background-size: 8px 8px; }
.bg-6 { background-color: #fffaf0; background-image: linear-gradient(90deg, #d2b48c 50%, transparent 50%); background-size: 8px 8px; }
.bg-7 { background-color: #64b4f0; background-image: linear-gradient(#fff 2px, transparent 2px); background-size: 8px 8px; }
.bg-8 { background-image: linear-gradient(90deg, #96c8ff 50%, transparent 50%); background-size: 8px 8px; }
.bg-9 { background-color: #fffdea; background-image: linear-gradient(45deg, #228b22 25%, transparent 25%); background-size: 8px 8px; }
.bg-10 { background-image: linear-gradient(135deg, #a9a9a9 25%, transparent 25%); background-size: 8px 8px; }
.bg-11 { background-image: linear-gradient(90deg, #b3e5fc 50%, transparent 50%), linear-gradient(#b3e5fc 50%, transparent 50%); background-size: 8px 8px; }
.bg-12 { background-image: linear-gradient(90deg, #ef5350 50%, transparent 50%); background-size: 8px 8px; }
.bg-13 { background-image: linear-gradient(45deg, #ffee58 25%, transparent 25%, transparent 50%, #ffee58 50%, #ffee58 75%, transparent 75%, transparent); background-size: 8px 8px; }
.bg-14 { background-image: linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px); background-size: 8px 8px; }
.bg-15 { background-color: #81c784; background-image: linear-gradient(90deg, #2e7d32 50%, transparent 50%), linear-gradient(#2e7d32 50%, transparent 50%); background-size: 8px 8px; }
.bg-16 { background-image: radial-gradient(#ab47bc 20%, transparent 20%); background-size: 8px 8px; }
.bg-17 { background-color: #ffe0b2; background-image: linear-gradient(45deg, #fb8c00 25%, transparent 25%), linear-gradient(-45deg, #fb8c00 25%, transparent 25%); background-size: 8px 8px; }
.bg-18 { background-color: #b0bec5; background-image: linear-gradient(45deg, #cfd8dc 25%, transparent 25%), linear-gradient(-45deg, #cfd8dc 25%, transparent 25%); background-size: 8px 8px; }
.bg-19 { background-image: linear-gradient(90deg, #f8bbd0 50%, transparent 50%); background-size: 8px 8px; }
.bg-20 { background-color: #d7ccc8; background-image: linear-gradient(90deg, #8d6e63 50%, transparent 50%), linear-gradient(#8d6e63 50%, transparent 50%); background-size: 8px 8px; }

/* 畫布區 */
#canvas{
    position: relative;
    width: min(80vw, 900px);
    aspect-ratio: 3/2;
    margin: 15px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    background: #fff;
    padding: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    z-index: 1;
}

.frame{ position:relative; background: #fff; z-index: 5; }

.border{ position:absolute; z-index: 10; pointer-events: none; }
.top{top:0;height:15%;width:100%;}
.bottom{bottom:0;height:15%;width:100%;}
.left{left:0;width:15%;height:100%;}
.right{right:0;width:15%;height:100%;}

.center{
    position:absolute; width:70%; height:70%;
    top:50%; left:50%; transform:translate(-50%,-50%);
    overflow:hidden; background: #000; z-index: 5;
}

video, .photo { width:100%; height:100%; object-fit:cover; }
.count {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:80px; color:#fff; text-shadow:0 0 20px rgba(0,0,0,0.8); z-index: 20;
}

/* 貼圖 */
.sticker { 
    position:absolute; 
    cursor:move; 
    z-index: 100; 
    user-select: none; 
    touch-action: none;
    transition: width 0.2s ease, font-size 0.2s ease;
}

.controls { margin: 15px 0 40px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
button{
    padding: 10px 20px; border:none; border-radius:25px;
    font-size:15px; font-weight: bold; color:#fff;
    background:linear-gradient(45deg,#ff7eb3,#ff758c); cursor:pointer;
    box-shadow: 0 4px 10px rgba(255,117,140,0.3);
}
.linkBtn{ background:linear-gradient(45deg,#36d1dc,#5b86e5); }
.infoBtn{ background:linear-gradient(45deg,#ffa726,#fb8c00); }
</style>
</head>

<body>

<div class="panel" id="panel-left"><div class="col-title">💝 貼圖</div></div>
<div class="panel" id="panel-right"><div class="col-title">😊 Emoji</div></div>

<h2 style="color: #d81b60; margin: 15px 0;">🌸 豐洲國小 母親節 AI 拍貼機 🌸</h2>

<div id="canvas"></div>

<div class="controls">
    <button onclick="start()">📸 開始拍照</button>
    <button id="toggleBtn" onclick="toggleCut()">🧍 AI 去背(白底)</button>
    <button onclick="shuffleBorders()">🔄 隨機換邊框</button>
    <button onclick="download1()">💾 下載圖檔</button>
    <button class="infoBtn" onclick="window.open('readme.png', '_blank')">💡 操作說明</button>
    <button class="linkBtn" onclick="window.open('https://pjes.tc.edu.tw/')">🔗 上傳作品</button>
</div>

<script>
let frames = [];
let isCutMode = false;
let selfieSegmentation = null;
let currentStream = null;
let currentFrameToProcess = null; // 用於回調定位
const pinkColors = ['#fce4ec', '#f8bbd0', '#f48fb1', '#f06292', '#ec407a', '#d81b60', '#ffcdd2', '#ef9a9a'];
const emojiList = "⚽🍉🌺🐶🏀🍎🌻🦊🏐🍌🌷🐴🎾🍓🌵🐹🌈⭐🍀";

async function init() {
    const canvasDiv = document.getElementById("canvas");

    // 初始化 MediaPipe
    selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`,
    });
    selfieSegmentation.setOptions({ modelSelection: 1 });
    selfieSegmentation.onResults(onResultsHandler);

    try {
        currentStream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480, facingMode: "user" } 
        });
    } catch (e) {
        alert("無法開啟相機，請檢查權限設定。");
    }

    for(let i=0; i<4; i++){
        let f = document.createElement("div");
        f.className = "frame";
        let c = document.createElement("div");
        c.className = "center";
        let v = createVideoElement();
        let count = document.createElement("div");
        count.className = "count";
        c.appendChild(v); c.appendChild(count);
        f.appendChild(c); 
        canvasDiv.appendChild(f);
        frames.push({video:v, center:c, count:count, frame:f, style:null, original:null, cut:null});
    }
    shuffleBorders();
    initPanels();
}

function createVideoElement() {
    let v = document.createElement("video");
    v.autoplay = true; v.playsInline = true;
    if(currentStream) v.srcObject = currentStream;
    return v;
}

async function start(){
    for(let f of frames) {
        f.center.innerHTML = ""; 
        let v = createVideoElement();
        let countDiv = document.createElement("div");
        countDiv.className = "count";
        f.video = v; f.count = countDiv;
        f.center.appendChild(v); f.center.appendChild(countDiv);
    }
    for(let f of frames){
        await new Promise(res => {
            let n = 3;
            let t = setInterval(() => {
                if(n > 0) f.count.innerText = n--;
                else { clearInterval(t); f.count.innerText = ""; capture(f); res(); }
            }, 800);
        });
        await new Promise(r => setTimeout(r, 500)); // 等待 AI 處理緩衝
    }
}

async function capture(f){
    let tempC = document.createElement("canvas");
    tempC.width = 640; tempC.height = 480;
    let ctx = tempC.getContext("2d");
    
    // 美肌
    ctx.filter = "brightness(1.1) contrast(1.05) saturate(1.1) blur(0.2px)";
    ctx.drawImage(f.video, 0, 0, 640, 480);
    ctx.filter = "none";
    
    f.original = tempC.toDataURL("image/jpeg", 0.9);

    // 傳送至 MediaPipe 處理
    currentFrameToProcess = f;
    await selfieSegmentation.send({image: tempC});
}

// 修正後的去背合成邏輯
function onResultsHandler(results) {
    if (!currentFrameToProcess) return;
    const f = currentFrameToProcess;
    
    const cutCanvas = document.createElement("canvas");
    cutCanvas.width = 640; cutCanvas.height = 480;
    const cutCtx = cutCanvas.getContext("2d");

    // 1. 先把「人像」畫出來 (利用 Mask)
    // 我們先將 Mask 畫到畫布上
    cutCtx.drawImage(results.segmentationMask, 0, 0, 640, 480);
    
    // 2. 設定合成模式為 source-in：只保留新畫上的內容(人像)與舊內容(Mask)重疊的部分
    cutCtx.globalCompositeOperation = 'source-in';
    cutCtx.drawImage(results.image, 0, 0, 640, 480);

    // 3. 設定合成模式為 destination-over：在「背後」補上內容
    cutCtx.globalCompositeOperation = 'destination-over';
    cutCtx.fillStyle = "#FFFFFF"; // 白色背景
    cutCtx.fillRect(0, 0, 640, 480);
    
    f.cut = cutCanvas.toDataURL("image/png");
    showImage(f, isCutMode ? f.cut : f.original);
}

function showImage(f, src){
    if(!src) return;
    f.center.innerHTML = "";
    let img = new Image(); img.src = src; img.className = "photo";
    f.center.appendChild(img);
}

function toggleCut(){
    isCutMode = !isCutMode;
    frames.forEach(f => { if(f.original) showImage(f, isCutMode ? f.cut : f.original); });
    document.getElementById("toggleBtn").innerText = isCutMode ? "🖼️ 恢復原圖" : "🧍 AI 去背(白底)";
}

/* --- 以下維持功能不變 --- */

function shuffleBorders() {
    const canvasDiv = document.getElementById("canvas");
    canvasDiv.querySelectorAll(".sticker-auto").forEach(s => s.remove());
    frames.forEach((f, idx) => {
        f.frame.querySelectorAll(".border").forEach(b => b.remove());
        let frameStyle = Math.random() > 0.4 
            ? { type: 'color', val: pinkColors[Math.floor(Math.random()*pinkColors.length)] }
            : { type: 'class', val: 'bg-' + (Math.floor(Math.random()*20)+1) };
        f.style = frameStyle;
        ["top","bottom","left","right"].forEach(p => {
            let b = document.createElement("div");
            b.className = "border " + p;
            if(frameStyle.type === 'color') b.style.backgroundColor = frameStyle.val;
            else b.classList.add(frameStyle.val);
            f.frame.appendChild(b);
        });
        autoAddStickersToCanvas(idx);
    });
}

function autoAddStickersToCanvas(frameIdx) {
    const canvasDiv = document.getElementById("canvas");
    const rect = canvasDiv.getBoundingClientRect();
    const fw = rect.width / 2;
    const fh = rect.height / 2;
    const ox = (frameIdx % 2) * fw;
    const oy = Math.floor(frameIdx / 2) * fh;
    for(let i=0; i<2; i++){
        let n = Math.floor(Math.random() * 36) + 1;
        let s = createStickerElement(`IMAGE/mom(${n}).png`, 'img', 1.0);
        s.classList.add("sticker-auto");
        s.style.left = (ox + Math.random() * (fw-80)) + "px";
        s.style.top = (oy + Math.random() * (fh-80)) + "px";
        canvasDiv.appendChild(s);
    }
}

function initPanels() {
    const left = document.getElementById("panel-left");
    const right = document.getElementById("panel-right");
    for(let i=1; i<=36; i++){
        let img = document.createElement("img");
        img.src = `IMAGE/mom(${i}).png`;
        img.onerror = () => img.remove();
        img.onclick = () => addManualSticker(img.src, 'img');
        left.appendChild(img);
    }
    Array.from(emojiList).forEach(emoji => {
        let span = document.createElement("div");
        span.className = "emoji-item";
        span.innerText = emoji;
        span.onclick = () => addManualSticker(emoji, 'emoji');
        right.appendChild(span);
    });
}

function addManualSticker(content, type) {
    const canvasDiv = document.getElementById("canvas");
    let s = createStickerElement(content, type, 1.0);
    canvasDiv.appendChild(s);
    const rect = canvasDiv.getBoundingClientRect();
    s.style.left = (rect.width / 2 - 40) + "px";
    s.style.top = (rect.height / 2 - 40) + "px";
}

function createStickerElement(content, type, initialScale) {
    let el = (type === 'img') ? document.createElement("img") : document.createElement("div");
    el.dataset.type = type; el.dataset.scale = initialScale; 
    if(type === 'img') { el.src = content; el.style.width = (80 * initialScale) + "px"; }
    else { el.innerText = content; el.style.fontSize = (50 * initialScale) + "px"; }
    el.classList.add("sticker");
    makeInteractable(el);
    return el;
}

function makeInteractable(el) {
    let sx, sy, ox, oy, lastTap = 0;
    const updateSize = () => {
        let scale = parseFloat(el.dataset.scale);
        if(el.dataset.type === 'img') el.style.width = (80 * scale) + "px";
        else el.style.fontSize = (50 * scale) + "px";
    };
    const cycleScale = () => {
        let s = parseFloat(el.dataset.scale);
        if (s === 1.0) s = 1.5; else if (s === 1.5) s = 2.0; else if (s === 2.0) s = 3.0; else if (s === 3.0) s = 0.5; else s = 1.0;
        el.dataset.scale = s; updateSize();
    };
    const startMove = e => {
        const now = Date.now();
        if (now - lastTap < 300) { cycleScale(); return; }
        lastTap = now;
        const touch = e.touches ? e.touches[0] : e;
        sx = touch.clientX; sy = touch.clientY; ox = el.offsetLeft; oy = el.offsetTop;
        document.addEventListener(e.touches ? "touchmove" : "mousemove", moveListener, {passive: false});
        document.addEventListener(e.touches ? "touchend" : "mouseup", upListener);
    };
    const moveListener = e => {
        if(e.cancelable) e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        el.style.left = (ox + touch.clientX - sx) + "px"; el.style.top = (oy + touch.clientY - sy) + "px";
    };
    const upListener = () => {
        document.removeEventListener("mousemove", moveListener); document.removeEventListener("touchmove", moveListener);
    };
    el.addEventListener("mousedown", startMove); el.addEventListener("touchstart", startMove, {passive: false});
    el.onwheel = e => {
        e.preventDefault();
        let s = parseFloat(el.dataset.scale);
        s = e.deltaY > 0 ? s * 0.9 : s * 1.1;
        el.dataset.scale = s; updateSize();
    };
}

function download(){
    let out = document.createElement("canvas");
    out.width = 1800; out.height = 1200;
    let ctx = out.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,1800,1200);

    frames.forEach((f, i) => {
        let x = (i % 2) * 900; let y = Math.floor(i / 2) * 600;
        if(f.style.type === 'color') ctx.fillStyle = f.style.val; else ctx.fillStyle = "#f8bbd0";
        ctx.fillRect(x, y, 900, 90); ctx.fillRect(x, y + 510, 900, 90);
        ctx.fillRect(x, y, 135, 600); ctx.fillRect(x + 765, y, 135, 600);
        let img = f.center.querySelector("img");
        if(img) ctx.drawImage(img, x+135, y+90, 630, 420);
    });

    const canvasDiv = document.getElementById("canvas");
    const rect = canvasDiv.getBoundingClientRect();
    const ratio = 1800 / rect.width;
    canvasDiv.querySelectorAll(".sticker").forEach(s => {
        let sx = parseFloat(s.style.left) * ratio; let sy = parseFloat(s.style.top) * ratio;
        let sw = s.offsetWidth * ratio; let sh = s.offsetHeight * ratio;
        if(s.tagName === "IMG") { ctx.drawImage(s, sx, sy, sw, sh); }
        else {
            ctx.fillStyle = "#000";
            ctx.font = (parseFloat(window.getComputedStyle(s).fontSize) * ratio) + "px Arial";
            ctx.fillText(s.innerText, sx, sy + sh*0.8);
        }
    });

    let a = document.createElement("a");
    a.href = out.toDataURL("image/png");
    a.download = "豐洲國小_母親節拍貼.png";
    a.click();
}

window.onload = init;
</script>

</body>
</html>
