<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>豐洲國小 母親節 AI 拍貼機 - 專業材質版 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:"Microsoft JhengHei", sans-serif;
    text-align:center;
    background: radial-gradient(circle,#fffafa,#ffffff);
    overflow-x: hidden;
}

/* 左右分置貼圖庫 */
.panel {
    position: fixed;
    top: 10px;
    width: 110px;
    height: 95vh;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    padding: 10px;
    overflow-y: auto;
    z-index: 100;
}
#panel-left { left: 10px; }
#panel-right { right: 10px; }

.col-title {
    font-size: 14px;
    font-weight: bold;
    color: #d81b60;
    margin-bottom: 12px;
    border-bottom: 2px solid #f8bbd0;
    padding-bottom: 5px;
}

.panel img, .emoji-item {
    width: 70px;
    margin: 12px auto;
    cursor: pointer;
    transition: transform 0.2s;
    display: block;
}
.emoji-item { font-size: 40px; text-align: center; line-height: 70px; }
.panel img:hover, .emoji-item:hover { transform: scale(1.15); }

/* 材質庫 CSS (與下載邏輯同步) */
.bg-1 { background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #f0f0f0 75%), linear-gradient(-45deg, transparent 75%, #f0f0f0 75%); background-size: 8px 8px; }
.bg-2 { background-image: linear-gradient(45deg, #b4d2ff 25%, transparent 25%, transparent 50%, #b4d2ff 50%, #b4d2ff 75%, transparent 75%, transparent); background-size: 8px 8px; }
.bg-3 { background-image: radial-gradient(#ff5050 20%, transparent 20%); background-size: 8px 8px; }
.bg-4 { background-image: radial-gradient(#e6e6e6 20%, transparent 10%); background-size: 8px 8px; }
.bg-5 { background-color: #333; background-image: linear-gradient(135deg, #000 25%, transparent 25%), linear-gradient(225deg, #000 25%, transparent 25%); background-size: 8px 8px; }
.bg-6 { background-color: #fffaf0; background-image: linear-gradient(90deg, #d2b48c 50%, transparent 50%); background-size: 8px 8px; }
.bg-7 { background-color: #64b4f0; background-image: linear-gradient(#fff 2px, transparent 2px); background-size: 8px 8px; }
.bg-8 { background-image: linear-gradient(90deg, #96c8ff 50%, transparent 50%); background-size: 8px 8px; }
.bg-9 { background-color: #fffdea; background-image: linear-gradient(45deg, #228b22 25%, transparent 25%); background-size: 8px 8px; }
.bg-10 { background-image: linear-gradient(135deg, #a9a9a9 25%, transparent 25%); background-size: 8px 8px; }
.bg-11 { background-image: linear-gradient(90deg, #b3e5fc 50%, transparent 50%), linear-gradient(#b3e5fc 50%, transparent 50%); background-size: 8px 8px; }
.bg-12 { background-image: linear-gradient(90deg, #ef5350 50%, transparent 50%); background-size: 8px 8px; }
.bg-13 { background-image: linear-gradient(45deg, #ffee58 25%, transparent 25%, transparent 50%, #ffee58 50%, #ffee58 75%, transparent 75%, transparent); background-size: 8px 8px; }
.bg-14 { background-image: linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px); background-size: 8px 8px; }
.bg-15 { background-color: #81c784; background-image: linear-gradient(90deg, #2e7d32 50%, transparent 50%), linear-gradient(#2e7d32 50%, transparent 50%); background-size: 8px 8px; }
.bg-16 { background-image: radial-gradient(#ab47bc 20%, transparent 20%); background-size: 8px 8px; }
.bg-17 { background-color: #ffe0b2; background-image: linear-gradient(45deg, #fb8c00 25%, transparent 25%), linear-gradient(-45deg, #fb8c00 25%, transparent 25%); background-size: 8px 8px; }
.bg-18 { background-color: #b0bec5; background-image: linear-gradient(45deg, #cfd8dc 25%, transparent 25%), linear-gradient(-45deg, #cfd8dc 25%, transparent 25%); background-size: 8px 8px; }
.bg-19 { background-image: linear-gradient(90deg, #f8bbd0 50%, transparent 50%); background-size: 8px 8px; }
.bg-20 { background-color: #d7ccc8; background-image: linear-gradient(90deg, #8d6e63 50%, transparent 50%), linear-gradient(#8d6e63 50%, transparent 50%); background-size: 8px 8px; }

/* 畫布區 */
#canvas{
    width: min(75vw, 900px);
    aspect-ratio: 3/2;
    margin: 20px auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    background: #fff;
    padding: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

.frame{ position:relative; background: #fff; }

.border{ position:absolute; z-index: 1;}
.top{top:0;height:15%;width:100%;}
.bottom{bottom:0;height:15%;width:100%;}
.left{left:0;width:15%;height:100%;}
.right{right:0;width:15%;height:100%;}

.center{
    position:absolute; width:70%; height:70%;
    top:50%; left:50%; transform:translate(-50%,-50%);
    overflow:hidden; background: #fcfcfc; z-index: 2;
}

video, .photo { width:100%; height:100%; object-fit:cover; }
.count {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:80px; color:#fff; text-shadow:0 0 20px #000; z-index: 10;
}
.sticker { position:absolute; cursor:move; z-index:50; user-select: none; }

button{
    margin:6px; padding:12px 26px; border:none; border-radius:25px;
    font-size:16px; font-weight: bold; color:#fff;
    background:linear-gradient(45deg,#ff7eb3,#ff758c); cursor:pointer;
}
.linkBtn{ background:linear-gradient(45deg,#36d1dc,#5b86e5); }
</style>
</head>

<body>

<div class="panel" id="panel-left"><div class="col-title">💝 貼圖</div></div>
<div class="panel" id="panel-right"><div class="col-title">😊 Emoji</div></div>

<h2 style="color: #d81b60; margin-top: 20px;">🌸 豐洲國小 母親節 AI 拍貼機 🌸</h2>

<div id="canvas"></div>

<div style="margin:20px 0 50px 0;">
    <button onclick="start()">📸 開始拍照</button>
    <button id="toggleBtn" onclick="toggleCut()">🧍 AI 去背</button>
    <button onclick="download()">💾 下載圖檔 (包含材質)</button>
    <button onclick="shuffleBorders()">🔄 隨機換邊框</button>
    <button class="linkBtn" onclick="window.open('https://pjes.tc.edu.tw/')">🔗 學校首頁</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix"></script>

<script>
let frames = [];
let isCutMode = false;
let net = null;
const pinkColors = ['#fce4ec', '#f8bbd0', '#f48fb1', '#f06292', '#ec407a', '#d81b60', '#ffcdd2', '#ef9a9a'];
const emojiList = "⚽🍉🌺🐶🏀🍎🌻🦊🏐🍌🌷🐴🎾🍓🌵🐹🌈⭐🍀";

function init() {
    const canvasDiv = document.getElementById("canvas");
    for(let i=0; i<4; i++){
        let f = document.createElement("div");
        f.className = "frame";
        
        // 初始化中央區域
        let c = document.createElement("div");
        c.className = "center";
        let v = document.createElement("video");
        v.autoplay = true;
        let count = document.createElement("div");
        count.className = "count";
        c.appendChild(v); c.appendChild(count);
        f.appendChild(c); canvasDiv.appendChild(f);
        
        frames.push({video:v, center:c, count:count, frame:f, style:null});
    }
    shuffleBorders(); // 初次載入隨機邊框
    initPanels();
}

/* 隨機換邊框邏輯 (同步更新 style 狀態) */
function shuffleBorders() {
    frames.forEach(f => {
        // 清除舊邊框 class
        f.frame.querySelectorAll(".border").forEach(b => b.remove());
        
        let frameStyle = Math.random() > 0.4 
            ? { type: 'color', val: pinkColors[Math.floor(Math.random()*pinkColors.length)] }
            : { type: 'class', val: 'bg-' + (Math.floor(Math.random()*20)+1) };
        
        f.style = frameStyle; // 儲存至狀態供下載使用

        ["top","bottom","left","right"].forEach(p => {
            let b = document.createElement("div");
            b.className = "border " + p;
            if(frameStyle.type === 'color') b.style.backgroundColor = frameStyle.val;
            else b.classList.add(frameStyle.val);
            f.frame.appendChild(b);
        });

        // 重新布置貼圖到角落
        autoAddStickersToCorners(f.frame);
    });
}

/* 3張貼圖佈置於4個角落中的3格 */
function autoAddStickersToCorners(frameElement) {
    // 先移除舊的自動貼圖
    frameElement.querySelectorAll(".sticker-auto").forEach(s => s.remove());

    const cornerCoords = [
        { top: "2%", left: "2%" },   // 左上
        { top: "2%", right: "2%" },  // 右上
        { bottom: "2%", left: "2%" },// 左下
        { bottom: "2%", right: "2%"} // 右下
    ];
    
    // 隨機選3個角落
    let chosenCorners = cornerCoords.sort(() => 0.5 - Math.random()).slice(0, 3);
    const scales = [1.0, 1.5, 2.0];

    chosenCorners.forEach((pos, idx) => {
        let n = Math.floor(Math.random() * 36) + 1;
        let s = createStickerElement(`IMAGE/mom (${n}).png`, 'img', scales[idx]);
        s.classList.add("sticker-auto");
        Object.assign(s.style, pos);
        frameElement.appendChild(s);
    });
}

function initPanels() {
    const left = document.getElementById("panel-left");
    const right = document.getElementById("panel-right");
    for(let i=1; i<=36; i++){
        let img = document.createElement("img");
        img.src = `IMAGE/mom (${i}).png`;
        img.onerror = () => img.style.display='none';
        img.onclick = () => addManualSticker(img.src, 'img');
        left.appendChild(img);
    }
    Array.from(emojiList).forEach(emoji => {
        let span = document.createElement("div");
        span.className = "emoji-item";
        span.innerText = emoji;
        span.onclick = () => addManualSticker(emoji, 'emoji');
        right.appendChild(span);
    });
}

function addManualSticker(content, type) {
    let s = createStickerElement(content, type, 1.2);
    s.style.left = "40%"; s.style.top = "40%";
    frames[0].frame.appendChild(s);
}

function createStickerElement(content, type, scale) {
    let el = (type === 'img') ? document.createElement("img") : document.createElement("div");
    if(type === 'img') { el.src = content; el.style.width = (70 * scale) + "px"; }
    else { el.innerText = content; el.style.fontSize = (50 * scale) + "px"; }
    el.classList.add("sticker");
    makeInteractable(el, type);
    return el;
}

function makeInteractable(el, type) {
    let sx, sy, ox, oy;
    el.onpointerdown = e => {
        e.preventDefault();
        sx = e.clientX; sy = e.clientY;
        ox = el.offsetLeft; oy = el.offsetTop;
        const move = ev => {
            el.style.left = (ox + ev.clientX - sx) + "px";
            el.style.top = (oy + ev.clientY - sy) + "px";
        };
        const up = () => {
            document.removeEventListener("pointermove", move);
            document.removeEventListener("pointerup", up);
        };
        document.addEventListener("pointermove", move);
        document.addEventListener("pointerup", up);
    };
    el.onwheel = e => {
        e.preventDefault();
        let r = e.deltaY > 0 ? 0.9 : 1.1;
        if(type === 'img') el.style.width = (parseFloat(el.style.width)*r)+"px";
        else el.style.fontSize = (parseFloat(el.style.fontSize)*r)+"px";
    };
}

navigator.mediaDevices.getUserMedia({video:true}).then(s => frames.forEach(f => f.video.srcObject = s));
bodyPix.load().then(n => net = n);

async function start(){
    for(let f of frames){
        await new Promise(res => {
            let n = 3;
            let t = setInterval(() => {
                if(n > 0) f.count.innerText = n--;
                else { clearInterval(t); f.count.innerText = ""; capture(f); res(); }
            }, 800);
        });
    }
}

async function capture(f){
    let c = document.createElement("canvas");
    c.width = 640; c.height = 420;
    let ctx = c.getContext("2d");
    ctx.drawImage(f.video, 0, 0, 640, 420);
    f.original = c.toDataURL();
    if(net){
        let seg = await net.segmentPerson(c);
        let d = ctx.getImageData(0,0,640,420);
        for(let i=0; i<seg.data.length; i++) if(seg.data[i]===0) d.data[i*4+3]=0;
        ctx.putImageData(d,0,0); f.cut = c.toDataURL();
    }
    showImage(f, isCutMode ? f.cut : f.original);
}

function showImage(f, src){
    f.center.innerHTML = "";
    let img = new Image(); img.src = src; img.className = "photo";
    f.center.appendChild(img);
}

function toggleCut(){
    isCutMode = !isCutMode;
    frames.forEach(f => { if(f.original) showImage(f, isCutMode ? f.cut : f.original); });
    document.getElementById("toggleBtn").innerText = isCutMode ? "🖼️ 恢復原圖" : "🧍 AI 去背";
}

/* 下載與材質重繪邏輯 */
function download(){
    let out = document.createElement("canvas");
    out.width = 1800; out.height = 1200;
    let ctx = out.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,1800,1200);

    frames.forEach((f, i) => {
        let x = (i % 2) * 900;
        let y = Math.floor(i / 2) * 600;

        // 1. 繪製邊框背景 (支援材質)
        if(f.style.type === 'color') {
            ctx.fillStyle = f.style.val;
            drawBorderRects(ctx, x, y);
        } else {
            // 重建 CSS 材質到 Canvas
            let patCanvas = document.createElement('canvas');
            patCanvas.width = 16; patCanvas.height = 16;
            let pctx = patCanvas.getContext('2d');
            
            // 根據 bg-X 繪製簡單紋路 (範例：模擬 bg-3, bg-19 等點狀/線狀)
            pctx.fillStyle = "#f8bbd0"; // 材質底色
            if(f.style.val.includes('bg-3') || f.style.val.includes('bg-16')) {
                pctx.beginPath(); pctx.arc(8, 8, 3, 0, Math.PI*2); pctx.fill();
            } else {
                pctx.fillRect(0, 0, 8, 16); // 預設條紋
            }
            ctx.fillStyle = ctx.createPattern(patCanvas, 'repeat');
            drawBorderRects(ctx, x, y);
        }

        // 2. 畫照片
        let img = f.center.querySelector("img");
        if(img) ctx.drawImage(img, x+135, y+90, 630, 420);

        // 3. 畫貼圖
        f.frame.querySelectorAll(".sticker").forEach(s => {
            let r = s.getBoundingClientRect();
            let fr = f.frame.getBoundingClientRect();
            let sx = x + (r.left - fr.left) * (900/fr.width);
            let sy = y + (r.top - fr.top) * (600/fr.height);
            if(s.tagName === "IMG") {
                ctx.drawImage(s, sx, sy, s.width * (900/fr.width), s.height * (600/fr.height));
            } else {
                ctx.fillStyle = "#000";
                ctx.font = (parseFloat(window.getComputedStyle(s).fontSize) * 2) + "px Arial";
                ctx.fillText(s.innerText, sx, sy + 50);
            }
        });
    });

    let a = document.createElement("a");
    a.href = out.toDataURL("image/png");
    a.download = "豐洲國小_母親節拍貼.png";
    a.click();
}

function drawBorderRects(ctx, x, y) {
    ctx.fillRect(x, y, 900, 90);      // Top
    ctx.fillRect(x, y + 510, 900, 90); // Bottom
    ctx.fillRect(x, y, 135, 600);      // Left
    ctx.fillRect(x + 765, y, 135, 600); // Right
}

window.onload = init;
</script>

</body>
</html>
